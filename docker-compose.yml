services:
  backend:
    build: ./backend
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://host.docker.internal:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - DATABASE_URL=postgresql://postgres:Denmarks123$$@host.docker.internal/brain-vault
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

  celery_worker:
    build: ./backend
    command: sh -c "uv run alembic upgrade head && uv run celery -A app.celery_app worker --loglevel=info --concurrency=2"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://host.docker.internal:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
