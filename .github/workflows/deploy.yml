name: Deploy Memwyre

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: memwyre-backend
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build backend Docker image → push to ECR
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          IMAGE_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker build -t $IMAGE_URI -t $IMAGE_LATEST ./backend
          docker push $IMAGE_URI
          docker push $IMAGE_LATEST

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Job 2: Build frontend → deploy to S3
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}/api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: frontend
        run: |
          # 1. Sync assets with long-lived immutable cache (fingerprinted JS/CSS)
          aws s3 sync dist/ s3://$S3_BUCKET/ --delete \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.png" \
            --exclude "*.ico" \
            --exclude "*.svg" \
            --exclude "*.txt" \
            --exclude "*.xml" \
            --exclude "*.json" \
            --exclude "*.md"

          # 2. Static assets (images, icons, manifests): short cache
          aws s3 sync dist/ s3://$S3_BUCKET/ \
            --acl public-read \
            --cache-control "public, max-age=3600, must-revalidate" \
            --exclude "*" \
            --include "*.png" \
            --include "*.ico" \
            --include "*.svg" \
            --include "*.txt" \
            --include "*.xml" \
            --include "*.json" \
            --include "*.md"

          # 3. HTML files (Root + Docs + any other subfolders): never cache
          # We use --include "*.html" to catch index.html and docs/index.html
          aws s3 sync dist/ s3://$S3_BUCKET/ \
            --acl public-read \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E33X26FANBG9K9 \
            --paths "/index.html" "/docs/*" "/image.svg" "/robots.txt" "/sitemap.xml"

  # ─────────────────────────────────────────────
  # Job 3: Deploy backend to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}



      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml,deploy/nginx/,deploy/init-letsencrypt.sh
          target: /opt/memwyre/

      - name: Get ECR login password
        id: ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD
          script: |
            set -e

            # Login to ECR (password obtained from GitHub runner)
            echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            # Construct image name
            ECR_IMAGE="$ECR_REGISTRY/memwyre-backend:latest"

            # Pull latest image
            sudo docker pull $ECR_IMAGE

            cd /opt/memwyre

            # Write the ECR image to an env override
            echo "ECR_IMAGE=$ECR_IMAGE" > .env.ecr

            # Cleanly stop services and remove orphans
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file .env.ecr down --remove-orphans || true

            # Start Redis first and flush stale Celery tasks
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file .env.ecr up -d redis
            sleep 3
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file .env.ecr exec -T redis redis-cli FLUSHALL
            echo "Redis flushed — stale tasks cleared"

            # Deploy all services
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file .env.ecr up -d

            # Aggressive cleanup: remove all unused images, stopped containers, and build cache
            sudo docker system prune -af

            # Health check
            sleep 10
            curl -sf https://api.memwyre.tech/health || (echo "Health check failed!" && exit 1)
            echo "Deployment successful!"

